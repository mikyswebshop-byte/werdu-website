name: Deploy to Werdu Live
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/shoptimizer-child-theme/**'
      - '.github/workflows/deploy-live.yml'

jobs:
  deploy-live:
    name: Deploy shoptimizer-child to werdu.de
    runs-on: ubuntu-latest
    steps:
      - name: Require LIVE FTP secrets
        env:
          LIVE_FTP_SERVER: ${{ secrets.LIVE_FTP_SERVER }}
          LIVE_FTP_USERNAME: ${{ secrets.LIVE_FTP_USERNAME }}
          LIVE_FTP_PASSWORD: ${{ secrets.LIVE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in LIVE_FTP_SERVER LIVE_FTP_USERNAME LIVE_FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name (production werdu.de FTP). Do not fall back to TEST_*."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Get latest code
        uses: actions/checkout@v4

      # LIVE FTP user is chrooted to the production document root (httpdocs).
      # Use /wp-content/... — never /httpdocs/... (that nests a useless folder).
      # Never fall back to TEST_* credentials (those land on test.werdu.de only).
      - name: FTP deploy theme fixes to werdu.de
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LIVE_FTP_SERVER }}
          username: ${{ secrets.LIVE_FTP_USERNAME }}
          password: ${{ secrets.LIVE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/shoptimizer-child-theme/
          server-dir: /wp-content/themes/shoptimizer-child-theme/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            functions.php
            **/.ftp-deploy-sync-state.json
