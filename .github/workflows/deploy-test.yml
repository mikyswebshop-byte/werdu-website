name: Deploy to Test Environment
# Manual only — automatic push deploys polluted test.werdu.de and are not production.
# Production (werdu.de) uses deploy-live.yml + LIVE_FTP_* secrets.
on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to test.werdu.de
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # Never upload laptop/Cursor/Git tooling into the public web root.
    - name: Strip non-public repo files before FTP
      run: |
        set -euo pipefail
        rm -rf .github .githooks .git
        rm -f .cursorrules .gitignore .gitattributes .editorconfig
        rm -f .git-ftp.log .git-ftp-ignore .deployignore
        rm -f README.md LICENSE
        rm -f apply-openseo-audit.py fix-db-calc-urls.php test-php.php
        rm -f elementor-*-export.json
        rm -f wpt-hotlinked-image-stub.png
        rm -f readme.html liesmich.html license.txt

    # Host blocks/times out SFTP:22; Plesk FTP listens on port 21.
    # TEST FTP user is chrooted to the test document root — use / not /httpdocs/.
    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.TEST_FTP_SERVER }}
        username: ${{ secrets.TEST_FTP_USERNAME }}
        password: ${{ secrets.TEST_FTP_PASSWORD }}
        protocol: ftp
        port: 21
        local-dir: ./
        server-dir: /
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.github/**
          **/.githooks/**
          **/.cursorrules
          **/node_modules/**
          **/.DS_Store
